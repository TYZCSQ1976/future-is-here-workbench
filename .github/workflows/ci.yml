name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Release boundary check
        run: npm run release:check
